<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>糖果交炸煎 - 登录</title>
  <!-- 默认入口直进游戏：仅显式 ?login=1（设置里「返回登录页」）才停留在登录页，首帧前跳转避免闪现 -->
  <script>
    if (!new URLSearchParams(location.search).has("login")) location.replace("game.html");
  </script>
  <link rel="stylesheet" href="style.css" />
  <!-- AB 分流引擎：首帧前判定变体，避免闪烁（实验设计见 docs/experiments/2026-10-04-login-consent-ab-test.md） -->
  <script>
    (function () {
      try {
        // QA 覆盖：仅会话级 URL 参数（?ab=v0|v1|v2），不影响真实流量分桶
        var override = new URLSearchParams(location.search).get("ab");
        if (override && ["v0", "v1", "v2"].indexOf(override) > -1) {
          document.documentElement.dataset.abVariant = override;
          window.__AB_VARIANT__ = override;
          return;
        }
        var k = "ab_device_id";
        var id = localStorage.getItem(k);
        if (!id) {
          id = Math.random().toString(36).slice(2) + Date.now().toString(36);
          localStorage.setItem(k, id);
        }
        // djb 变体哈希 → 33/33/33 分桶，同一设备 ID 恒定命中同一变体
        var h = 0;
        for (var i = 0; i < id.length; i++) h = ((h * 131) + id.charCodeAt(i)) >>> 0;
        var b = h % 100;
        var variant = b < 33 ? "v0" : b < 66 ? "v1" : "v2";
        document.documentElement.dataset.abVariant = variant;
        window.__AB_VARIANT__ = variant;
        window.__AB_DEVICE_ID__ = id;
      } catch (e) {
        // 存储不可用时回退对照组
        document.documentElement.dataset.abVariant = "v0";
        window.__AB_VARIANT__ = "v0";
      }
    })();
  </script>
</head>
<body>
  <!-- 背景漂浮糖果装饰 -->
  <div class="candy-bg">
    <span class="candy c1"></span>
    <span class="candy c2"></span>
    <span class="candy c3"></span>
    <span class="candy c4"></span>
    <span class="candy c5"></span>
    <span class="candy c6"></span>
  </div>

  <div class="login-container">
    <!-- LOGO 区域 -->
    <div class="logo-section">
      <div class="logo-icon">
        <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
          <defs>
            <linearGradient id="candyGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff6b9d" />
              <stop offset="100%" stop-color="#c44dff" />
            </linearGradient>
          </defs>
          <!-- 糖果主体 -->
          <circle cx="32" cy="34" r="18" fill="url(#candyGrad)" />
          <circle cx="32" cy="34" r="18" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 3" opacity="0.7" />
          <!-- 糖果纸左边 -->
          <path d="M14 34 L4 26 L8 34 L4 42 Z" fill="#ff6b9d" />
          <!-- 糖果纸右边 -->
          <path d="M50 34 L60 26 L56 34 L60 42 Z" fill="#c44dff" />
          <!-- 高光 -->
          <ellipse cx="26" cy="28" rx="5" ry="3" fill="#fff" opacity="0.5" />
        </svg>
      </div>
      <h1 class="game-title">糖果交炸煎</h1>
      <p class="game-slogan">趣味消除，甜蜜来袭</p>
    </div>

    <!-- 登录卡片 -->
    <div class="login-card">
      <form id="loginForm" novalidate>
        <!-- 账号输入框 -->
        <div class="input-group">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <input type="text" id="username" placeholder="请输入账号" autocomplete="username" />
        </div>

        <!-- 密码输入框 -->
        <div class="input-group">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" />
          <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="显示密码">
            <!-- 睁眼图标 -->
            <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <!-- 闭眼图标 -->
            <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>

        <!-- 记住我 + 忘记密码 -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" />
            <span class="checkbox-custom"></span>
            <span>记住我</span>
          </label>
          <a href="#" class="forgot-link" onclick="return false;">忘记密码？</a>
        </div>

        <!-- 登录按钮 -->
        <button type="submit" class="login-btn" id="loginBtn">登 录</button>

        <!-- 注册入口 -->
        <div class="register-hint">
          还没有账号？<a href="#" class="register-link" onclick="return false;">立即注册</a>
        </div>

        <!-- 分割线 -->
        <div class="divider">
          <span>其他登录方式</span>
        </div>

        <!-- 第三方登录 -->
        <div class="social-login">
          <button type="button" class="social-btn wechat" aria-label="微信登录" title="微信">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.406-.032zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z" />
            </svg>
          </button>
          <button type="button" class="social-btn qq" aria-label="QQ登录" title="QQ">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M12.003 2c-2.265 0-6.29 1.364-6.29 7.325v1.195S3.55 14.96 3.55 17.474c0 .665.17 1.025.281 1.025.11 0 .1.264.233.41.136.147 2.032.147 2.032.147s.17.34.312.5c.142.16.31.454.31.454l.082.233s.67.49 1.66.672c.04.098.074.2.11.3a4.03 4.03 0 0 0 .196.548c.07.147.147.282.222.41.074.127.15.243.225.354.18.27.386.504.616.7.168.142.36.273.58.382.198.1.42.185.666.255.245.07.51.12.79.15.28.03.575.043.885.043s.604-.013.885-.043c.28-.03.545-.08.79-.15.246-.07.467-.154.666-.255.22-.11.413-.24.58-.382.23-.196.437-.43.617-.7.074-.111.15-.227.224-.354.075-.128.152-.263.222-.41.062-.131.124-.275.196-.548.036-.1.07-.202.11-.3.99-.182 1.66-.672 1.66-.672l.082-.233s.17-.294.31-.454c.143-.16.313-.5.313-.5s1.896 0 2.032-.147c.133-.146.123-.41.233-.41.111 0 .282-.36.282-1.025 0-2.514-2.164-6.954-2.164-6.954V9.325C18.294 3.364 14.268 2 12.003 2z" />
            </svg>
          </button>
          <button type="button" class="social-btn apple" aria-label="Apple登录" title="Apple">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
            </svg>
          </button>
        </div>

        <!-- 用户协议 -->
        <div class="agreement">
          <label class="checkbox-label">
            <input type="checkbox" id="agreement" />
            <span class="checkbox-custom"></span>
            <span class="agreement-text">
              我已阅读并同意
              <a href="#" onclick="return false;">《用户协议》</a>
              <a href="#" onclick="return false;">《隐私政策》</a>
            </span>
          </label>
        </div>
      </form>
    </div>

    <!-- 版本号 -->
    <div class="version">v1.0.0</div>
  </div>

  <!-- V2 一步确认弹窗（仅 ab-variant=v2 显示路径，默认隐藏） -->
  <div class="ab-modal" id="consentModal" role="dialog" aria-modal="true" aria-labelledby="consentModalTitle">
    <div class="ab-modal-mask"></div>
    <div class="ab-modal-card">
      <button type="button" class="ab-modal-close" id="consentModalClose" aria-label="关闭">×</button>
      <h2 class="ab-modal-title" id="consentModalTitle">服务协议及隐私保护</h2>
      <p class="ab-modal-summary">
        为了更好地保障您的合法权益，请阅读并同意以下协议
        <a href="#" class="ab-modal-link">《用户协议》</a><a href="#" class="ab-modal-link">《隐私政策》</a>
      </p>
      <button type="button" class="ab-modal-accept" id="consentAcceptBtn">同意并登录</button>
    </div>
  </div>

  <!-- R1 修订：勾选记住我时的协议确认弹窗 -->
  <div class="ab-modal" id="rememberConsentModal" role="dialog" aria-modal="true" aria-labelledby="rememberConsentTitle">
    <div class="ab-modal-mask"></div>
    <div class="ab-modal-card">
      <button type="button" class="ab-modal-close" id="rememberConsentClose" aria-label="关闭">×</button>
      <h2 class="ab-modal-title" id="rememberConsentTitle">服务协议及隐私保护</h2>
      <p class="ab-modal-summary">
        勾选"记住我"前，请先阅读并同意以下协议
        <a href="#" class="ab-modal-link">《用户协议》</a><a href="#" class="ab-modal-link">《隐私政策》</a>
      </p>
      <div class="ab-modal-actions">
        <button type="button" class="ab-modal-btn ab-modal-btn-cancel" id="rememberConsentCancel">取消</button>
        <button type="button" class="ab-modal-btn ab-modal-btn-accept" id="rememberConsentAccept">同意</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
